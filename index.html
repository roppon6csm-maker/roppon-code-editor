<script>
/**
 * Roppon Code Editor Ver.3.4
 * Section Jump Feature + AI Melody + High Quality Sound Engine
 */
const KEYS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const PARTS = ["イントロ", "Aメロ", "Bメロ", "プレコーラス", "サビ", "間奏", "Cメロ", "アウトロ"];
const DEG_TO_SEMITONE = { 
  "I":0, "II":2, "ii":2, "III":4, "iii":4, "IV":5, "iv":5, "V":7, "v":7, "VI":9, "vi":9, "VII":11, "vii":11, "vii°":11, "bVII":10, "bII":1, "bIII":3, "bVI":8, "V/vi": 11, "V/II": 9, "I7":0 
};

const TEMPLATES = [
  { name: "YOASOBI進行", deg: "IV-V-iii-vi", usage: "夜に駆ける等。浮遊感と疾走感。" },
  { name: "王道進行 (4536)", deg: "IV-V-iii-vi", usage: "J-POPの黄金律。サビに最適。" },
  { name: "ずとまよ進行", deg: "IV-III-vi-I", usage: "Just the Two of Us進行。都会的。" },
  { name: "小室進行", deg: "vi-IV-V-I", usage: "90年代ヒット曲。ドラマチック。" },
  { name: "カノン進行", deg: "I-V-vi-iii-IV-I-IV-V", usage: "普遍的な美しさ。" },
  { name: "ポップパンク進行", deg: "I-V-vi-IV", usage: "明るく開放的。洋楽の定番。" },
  { name: "Rising Sun進行", deg: "IV-V-vi-V", usage: "力強く盛り上がる。EXILE等。" },
  { name: "251進行", deg: "ii-V-I", usage: "ジャズ・ボサノバの基本。洗練。" },
  { name: "スパイス進行", deg: "IV-iv-I", usage: "サブドミナントマイナーの切なさ。" },
  { name: "ソウル進行", deg: "I-vi-ii-V", usage: "心地よい循環。ブラック系。" },
  { name: "浮遊進行", deg: "IV-I-V-vi", usage: "落ち着かない独特のバランス。" },
  { name: "悲しみ進行", deg: "vi-ii-V-I", usage: "マイナーからの解決。" },
  { name: "サークル進行", deg: "vi-ii-V-I-IV-vii-III-vi", usage: "五度圏を一周。" },
  { name: "ロックスター", deg: "I-IV-V-IV", usage: "シンプルで力強いロック。" }
];

let state = {
  bpm: 164, keyIndex: 0, beat: 8, drum: "Straight", isPlaying: false,
  lines: [
    { loop: true, melodyOn: false, melodyPattern: [], part: "サビ", chords: "F-G-Em-Am", templateName: "YOASOBI進行", templateDeg: "IV-V-iii-vi" }
  ],
  currentLineIndex: -1, currentBeatGlobal: 0, nextNoteTime: 0
};

let audioCtx = null;
let schedulerInterval = null;
let noiseBuffer = null;

function initAudio() { 
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
  if (!noiseBuffer) {
    const bufferSize = audioCtx.sampleRate * 2;
    noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  }
}

/* --- サウンドエンジン --- */

function playKick(time, vol = 1.0) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(180, time);
  osc.frequency.exponentialRampToValueAtTime(45, time + 0.15);
  gain.gain.setValueAtTime(vol * 0.8, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(time); osc.stop(time + 0.3);
}

function playSnare(time, vol = 1.0) {
  const noise = audioCtx.createBufferSource(); noise.buffer = noiseBuffer;
  const nFilter = audioCtx.createBiquadFilter(); nFilter.type = "highpass"; nFilter.frequency.value = 1200;
  const nGain = audioCtx.createGain();
  nGain.gain.setValueAtTime(vol * 0.35, time); nGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
  const osc = audioCtx.createOscillator(); osc.type = "triangle"; osc.frequency.setValueAtTime(200, time);
  osc.frequency.exponentialRampToValueAtTime(120, time + 0.1);
  const oGain = audioCtx.createGain();
  oGain.gain.setValueAtTime(vol * 0.45, time); oGain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
  noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(audioCtx.destination);
  osc.connect(oGain); oGain.connect(audioCtx.destination);
  noise.start(time); noise.stop(time + 0.2);
  osc.start(time); osc.stop(time + 0.15);
}

function playHiHat(time, isOpen = false, vol = 1.0) {
  const source = audioCtx.createBufferSource(); source.buffer = noiseBuffer;
  const filter = audioCtx.createBiquadFilter(); filter.type = "highpass"; filter.frequency.value = 8000;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol * 0.08, time); gain.gain.exponentialRampToValueAtTime(0.001, time + (isOpen ? 0.35 : 0.06));
  source.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  source.start(time); source.stop(time + 0.4);
}

function playPiano(freq, time, duration, isMinor = false, vol = 1.0) {
  if (freq <= 0) return;
  const master = audioCtx.createGain(); master.connect(audioCtx.destination);
  const intervals = isMinor ? [1, 1.189, 1.5] : [1, 1.25, 1.5];
  intervals.forEach((mult) => {
    const o1 = audioCtx.createOscillator(); const o2 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain(); const g2 = audioCtx.createGain();
    const f = freq * mult;
    o1.type = 'triangle'; o1.frequency.setValueAtTime(f, time);
    o2.type = 'sine'; o2.frequency.setValueAtTime(f * 4, time);
    o1.connect(g1); g1.connect(master); o2.connect(g2); g2.connect(master);
    master.gain.setValueAtTime(0, time);
    master.gain.linearRampToValueAtTime(vol * 0.2 / intervals.length, time + 0.005);
    master.gain.exponentialRampToValueAtTime(0.001, time + duration);
    g2.gain.setValueAtTime(0.15, time); g2.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
    o1.start(time); o1.stop(time + duration); o2.start(time); o2.stop(time + duration);
  });
}

function playMelody(freq, time, duration, vol = 1.0) {
  if (freq <= 0) return;
  const master = audioCtx.createGain(); master.connect(audioCtx.destination);
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(freq, time);
  master.gain.setValueAtTime(0, time);
  master.gain.linearRampToValueAtTime(vol * 0.15, time + 0.01);
  master.gain.exponentialRampToValueAtTime(0.001, time + duration);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.setValueAtTime(2000, time);
  filter.frequency.exponentialRampToValueAtTime(500, time + duration);
  osc.connect(filter); filter.connect(master);
  osc.start(time); osc.stop(time + duration);
}

/* --- メロディ生成ロジック --- */

function generateMelodyPattern(chords) {
  const pattern = [];
  const chordList = chords.split("-").map(c => c.trim()).filter(c => c);
  if (chordList.length === 0) return Array(64).fill(0);
  for (let i = 0; i < 64; i++) {
    const chordIdx = Math.floor((i / 64) * chordList.length);
    const chord = chordList[chordIdx];
    const isStrongBeat = (i % 4 === 0);
    const isWeakBeat = (i % 2 !== 0);
    if (Math.random() > (isStrongBeat ? 0.3 : (isWeakBeat ? 0.8 : 0.5))) {
      const f = getFreq(chord);
      if (f > 0) {
        const isMinor = chord.includes("m") || /[a-z]/.test(chord.split('/')[0]);
        const chordTones = isMinor ? [1, 1.189, 1.5, 1.78, 2] : [1, 1.25, 1.5, 1.88, 2];
        const tone = chordTones[Math.floor(Math.random() * chordTones.length)];
        pattern.push(f * tone * 2);
      } else pattern.push(0);
    } else pattern.push(0);
  }
  return pattern;
}

/* --- シーケンサー --- */

function scheduler() {
  while (state.nextNoteTime < audioCtx.currentTime + 0.1) {
    const isEven = state.currentBeatGlobal % 2 === 0;
    let timingOffset = 0;
    if (state.drum === "Shuffle" && !isEven) {
      timingOffset = (60.0 / state.bpm / 4) * 0.35;
    }
    scheduleNote(state.currentBeatGlobal, state.nextNoteTime + timingOffset);
    state.nextNoteTime += (60.0 / state.bpm) / 4;
    state.currentBeatGlobal++;
  }
}

function scheduleNote(beatNumber, time) {
  if (state.currentLineIndex === -1) return;
  const line = state.lines[state.currentLineIndex];
  if (!line) return;
  const chords = line.chords.split("-").map(c => c.trim()).filter(c => c);
  if (chords.length === 0) return;

  const total16ths = 64; 
  const cycleBeat = beatNumber % total16ths;
  const mBeat = cycleBeat % 16;
  const chordIdx = Math.floor((cycleBeat / total16ths) * chords.length);
  const currentChord = chords[chordIdx];

  const accent = (mBeat % 4 === 0) ? 1.3 : 0.75;
  const hhDiv = (state.beat === 16) ? 1 : (state.beat === 8 ? 2 : 4);
  if (cycleBeat % hhDiv === 0) playHiHat(time, false, (mBeat % 4 === 0 ? 1.0 : 0.6));

  if (state.drum === "Trap") {
    if (mBeat === 0 || mBeat === 6 || mBeat === 10 || mBeat === 13) playKick(time, 1.2);
    if (mBeat === 8) playSnare(time, 1.3);
  } else if (state.drum === "House") {
    if (mBeat % 4 === 0) playKick(time, 1.2);
    if (mBeat % 4 === 2) playHiHat(time, true, 0.9);
    if (mBeat === 4 || mBeat === 12) playSnare(time, 1.1);
  } else { 
    if (mBeat === 0 || mBeat === 8) playKick(time, (state.drum === "Shuffle" && mBeat === 9 ? 0.8 : accent));
    if (mBeat === 4 || mBeat === 12) playSnare(time, 1.0);
  }

  if (line.melodyOn && line.melodyPattern[cycleBeat] > 0) {
    playMelody(line.melodyPattern[cycleBeat], time, 0.15, 0.8);
  }

  const f = getFreq(currentChord);
  const isMinor = currentChord && (currentChord.includes("m") || /[a-z]/.test(currentChord.split('/')[0]));
  if (f > 0) {
    const isChange = (cycleBeat % (total16ths / chords.length) === 0);
    if (state.drum === "House") {
      if (mBeat % 4 === 0) playPiano(f, time, 0.45, isMinor, accent);
    } else if (state.drum === "Shuffle") {
      if (isChange || cycleBeat % 4 === 0) playPiano(f, time, (cycleBeat % 2 === 0 ? 0.35 : 0.1), isMinor, accent);
    } else {
      if (isChange || mBeat === 8) playPiano(f, time, 0.9, isMinor, accent);
    }
  }

  if (cycleBeat === total16ths - 1) {
    let nextIdx = line.loop ? state.currentLineIndex : (state.currentLineIndex + 1 >= state.lines.length ? 0 : state.currentLineIndex + 1);
    state.currentLineIndex = nextIdx;
    setTimeout(updateUIActive, 0);
  }
}

/* --- ヘルパー・UI --- */

function getFreq(chordName) {
  if (!chordName) return 0;
  const noteMap = { "C":0, "C#":1, "D":2, "D#":3, "E":4, "F":5, "F#":6, "G":7, "G#":8, "A":9, "A#":10, "B":11 };
  let base = chordName.replace(/m|dim|7|M7|sus4|aug/g, "").split("/")[0];
  let index = noteMap[base];
  if (index === undefined) return 0;
  return 440 * Math.pow(2, (index + state.keyIndex - 9 - 12) / 12);
}

function applyTemplate(degStr) {
  return degStr.split("-").map(d => {
    let clean = d.replace(/m|dim|7|M7|sus4|aug|\/.*|b|°/g, "");
    let offset = DEG_TO_SEMITONE[clean] || 0;
    if (d.startsWith('b')) offset -= 1;
    let n = KEYS[(state.keyIndex + offset) % 12];
    if (d.includes("m") || d.includes("°") || /^[a-z]/.test(d)) n += "m";
    return n;
  }).join("-");
}

function render() {
  const container = document.getElementById('line-container');
  const addBtn = document.getElementById('add-btn');
  if(!container || !addBtn) return;
  container.querySelectorAll('.line-row').forEach(r => r.remove());
  state.lines.forEach((line, idx) => {
    const row = document.createElement('div');
    row.className = `line-row ${ (idx === state.currentLineIndex && state.isPlaying) ? 'playing' : '' }`;
    
    // ★セクションジャンプ機能の追加
    row.onclick = (e) => {
      // ボタンや入力欄、モーダル要素をクリックした場合はジャンプさせない
      if (e.target.closest('.loop-btn, .mel-btn, .part-select, .chords-input, .template-display, .del-btn')) return;
      if (state.isPlaying) {
        state.currentLineIndex = idx;
        state.currentBeatGlobal = 0; // 次のノートから小節の頭にする
        updateUIActive();
      }
    };

    const lBtnBox = document.createElement('div'); lBtnBox.className = 'loop-btn-container';
    const lBtn = document.createElement('div'); lBtn.className = `loop-btn ${line.loop ? 'active' : ''}`;
    lBtn.onclick = (e) => { e.stopPropagation(); line.loop = !line.loop; render(); };
    lBtnBox.appendChild(lBtn);

    const mBtnBox = document.createElement('div'); mBtnBox.className = 'mel-btn-container';
    const mBtn = document.createElement('div'); mBtn.className = `mel-btn ${line.melodyOn ? 'active' : ''}`;
    mBtn.textContent = 'MEL';
    mBtn.onclick = (e) => { 
      e.stopPropagation();
      line.melodyOn = !line.melodyOn;
      if (line.melodyOn) line.melodyPattern = generateMelodyPattern(line.chords);
      render(); 
    };
    mBtnBox.appendChild(mBtn);

    const pSel = document.createElement('select'); pSel.className = 'part-select';
    PARTS.forEach(p => pSel.add(new Option(p, p))); pSel.value = line.part;
    pSel.onchange = (e) => line.part = e.target.value;
    const pWrap = document.createElement('div'); pWrap.className = 'part-wrapper'; pWrap.appendChild(pSel);
    
    const cIn = document.createElement('input'); cIn.className = 'chords-input';
    cIn.value = line.chords; cIn.onchange = (e) => { 
      line.chords = e.target.value; line.templateName = "Custom"; 
      if(line.melodyOn) line.melodyPattern = generateMelodyPattern(line.chords); 
      render(); 
    };
    const cWrap = document.createElement('div'); cWrap.className = 'chord-wrapper'; cWrap.appendChild(cIn);
    
    const tDisp = document.createElement('div'); tDisp.className = 'template-display';
    tDisp.innerHTML = `<div class="td-name">${line.templateName}</div><div class="td-deg">${line.templateDeg || ""}</div>`;
    tDisp.onclick = (e) => { e.stopPropagation(); showModal(idx); };
    
    const dBtn = document.createElement('div'); dBtn.className = 'del-btn'; dBtn.textContent = '×';
    dBtn.onclick = (e) => { e.stopPropagation(); if(state.lines.length > 1) { state.lines.splice(idx, 1); render(); } };
    
    row.append(lBtnBox, mBtnBox, pWrap, cWrap, tDisp, dBtn);
    container.insertBefore(row, addBtn);
  });
}

function updateUIActive() {
  document.querySelectorAll('.line-row').forEach((el, i) => {
    el.classList.toggle('playing', i === state.currentLineIndex);
  });
}

function showModal(lineIdx) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  content.innerHTML = '<h2 style="text-align:center; color:#666; margin-bottom:20px;">TEMPLATE LIBRARY</h2>';
  TEMPLATES.forEach(t => {
    const item = document.createElement('div'); item.className = 'modal-item';
    item.innerHTML = `<div style="display:flex; justify-content:space-between;"><strong>${t.name}</strong><span style="color:#00E5FF;">${t.deg}</span></div><div style="font-size:2.5vw; color:#888;">${t.usage}</div>`;
    item.onclick = () => {
      state.lines[lineIdx].templateName = t.name;
      state.lines[lineIdx].templateDeg = t.deg;
      state.lines[lineIdx].chords = applyTemplate(t.deg);
      if(state.lines[lineIdx].melodyOn) state.lines[lineIdx].melodyPattern = generateMelodyPattern(state.lines[lineIdx].chords);
      overlay.style.display = 'none'; render();
    };
    content.appendChild(item);
  });
  overlay.style.display = 'flex';
  overlay.onclick = (e) => { if(e.target===overlay) overlay.style.display='none'; };
}

/* --- エントリー --- */

document.getElementById('play-btn').onclick = async () => {
  initAudio(); if (audioCtx.state === 'suspended') await audioCtx.resume();
  if (state.isPlaying) {
    state.isPlaying = false; clearInterval(schedulerInterval);
    document.getElementById('play-btn').className = "play-btn play"; document.getElementById('play-btn').textContent = "PLAY";
    state.currentLineIndex = -1; updateUIActive();
  } else {
    state.isPlaying = true; state.currentLineIndex = 0;
    state.currentBeatGlobal = 0; state.nextNoteTime = audioCtx.currentTime + 0.1;
    document.getElementById('play-btn').className = "play-btn stop"; document.getElementById('play-btn').textContent = "STOP";
    schedulerInterval = setInterval(scheduler, 25);
  }
};

document.getElementById('add-btn').onclick = () => {
  state.lines.push({ loop: false, melodyOn: false, melodyPattern: [], part: "Aメロ", chords: "C-G-Am-F", templateName: "Custom" });
  render();
};

window.onload = () => {
  const b = document.getElementById('bpm-select'); for(let i=60;i<=200;i++) b.add(new Option(i,i)); b.value=state.bpm;
  const k = document.getElementById('key-select'); KEYS.forEach((n,i)=> k.add(new Option(n,i))); k.value=state.keyIndex;
  b.onchange = (e) => state.bpm = parseInt(e.target.value);
  k.onchange = (e) => { 
    state.keyIndex = parseInt(e.target.value); 
    state.lines.forEach(l => { if(l.templateDeg) l.chords = applyTemplate(l.templateDeg); });
    render(); 
  };
  document.getElementById('beat-select').onchange = (e) => state.beat = parseInt(e.target.value);
  document.getElementById('drum-select').onchange = (e) => state.drum = e.target.value;
  render();
};
</script>
</body>
