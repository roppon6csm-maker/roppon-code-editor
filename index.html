<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>シンプルブロック崩し</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on touch */
        }
        canvas {
            background-color: #111;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let touches pass through to canvas */
        }
        .message {
            color: #fff;
            font-family: sans-serif;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            pointer-events: auto; /* Allow clicking the message */
            cursor: pointer;
        }
        #startBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="uiLayer">
        <div id="messageBox" class="message" style="display: none;">
            <div id="messageText">タップしてスタート</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');

        // Set canvas size for mobile portrait
        function resizeCanvas() {
            const aspectRation = 9 / 16;
            let width = window.innerWidth;
            let height = window.innerHeight;

            if (width / height > aspectRation) {
                width = height * aspectRation;
            } else {
                height = width / aspectRation;
            }

            canvas.width = width;
            canvas.height = height;

            // Re-initialize game objects if canvas resizes
            if(gameState === 'init') {
                initGameObjects();
            }
        }
        window.addEventListener('resize', resizeCanvas);

        // Game objects
        let ball, paddle, blocks;
        let score = 0;
        let gameState = 'init'; // init, playing, gameover, clear

        const blockRowCount = 5;
        const blockColumnCount = 5;

        function initGameObjects() {
            const cw = canvas.width;
            const ch = canvas.height;

            // Paddle
            const paddleWidth = cw * 0.25;
            const paddleHeight = ch * 0.02;
            paddle = {
                x: (cw - paddleWidth) / 2,
                y: ch - paddleHeight - (ch * 0.05),
                w: paddleWidth,
                h: paddleHeight,
                color: '#00BFFF'
            };

            // Ball
            const ballRadius = cw * 0.02;
            ball = {
                x: cw / 2,
                y: paddle.y - ballRadius - 1,
                r: ballRadius,
                dx: cw * 0.008,
                dy: -ch * 0.006,
                speed: ch * 0.008,
                color: '#FF4500'
            };

            // Blocks
            blocks = [];
            const blockPadding = cw * 0.02;
            const blockOffsetTop = ch * 0.1;
            const blockOffsetLeft = cw * 0.04;
            const blockWidth = (cw - (blockOffsetLeft * 2) - (blockPadding * (blockColumnCount - 1))) / blockColumnCount;
            const blockHeight = ch * 0.04;

            const colors = ['#FF6347', '#FFA500', '#32CD32', '#1E90FF', '#9370DB'];

            for (let c = 0; c < blockColumnCount; c++) {
                blocks[c] = [];
                for (let r = 0; r < blockRowCount; r++) {
                    blocks[c][r] = {
                        x: (c * (blockWidth + blockPadding)) + blockOffsetLeft,
                        y: (r * (blockHeight + blockPadding)) + blockOffsetTop,
                        w: blockWidth,
                        h: blockHeight,
                        status: 1,
                        color: colors[r % colors.length]
                    };
                }
            }

            score = 0;
        }

        // Input handling
        let isTouching = false;
        let touchX = 0;

        canvas.addEventListener('touchstart', (e) => {
            isTouching = true;
            touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if (isTouching) {
                touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            }
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            isTouching = false;
            e.preventDefault();
        }, {passive: false});

        // Mouse fallback for testing on PC
        canvas.addEventListener('mousemove', (e) => {
            touchX = e.clientX - canvas.getBoundingClientRect().left;
        });

        messageBox.addEventListener('click', () => {
            if (gameState === 'init' || gameState === 'gameover' || gameState === 'clear') {
                initGameObjects();
                gameState = 'playing';
                messageBox.style.display = 'none';
                gameLoop();
            }
        });

        // Ensure first tap on screen also starts if msg box missed
        canvas.addEventListener('click', () => {
             if (gameState === 'init' || gameState === 'gameover' || gameState === 'clear') {
                initGameObjects();
                gameState = 'playing';
                messageBox.style.display = 'none';
                gameLoop();
            }
        });

        // Drawing functions
        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.fillStyle = paddle.color;
            ctx.fill();
            ctx.closePath();
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
        }

        function drawBlocks() {
            for (let c = 0; c < blockColumnCount; c++) {
                for (let r = 0; r < blockRowCount; r++) {
                    if (blocks[c][r].status === 1) {
                        let b = blocks[c][r];
                        ctx.beginPath();
                        ctx.rect(b.x, b.y, b.w, b.h);
                        ctx.fillStyle = b.color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function drawScore() {
            ctx.font = "20px Arial";
            ctx.fillStyle = "#fff";
            ctx.fillText("Score: " + score, 10, 30);
        }

        // Logic functions
        function movePaddle() {
            // Move paddle to touchX center
            paddle.x = touchX - (paddle.w / 2);

            // Boundary checks
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
        }

        function moveBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collision (left/right)
            if (ball.x + ball.dx > canvas.width - ball.r || ball.x + ball.dx < ball.r) {
                ball.dx = -ball.dx;
            }
            // Wall collision (top)
            if (ball.y + ball.dy < ball.r) {
                ball.dy = -ball.dy;
            } else if (ball.y + ball.dy > canvas.height - ball.r) {
                // Bottom
                gameState = 'gameover';
            }

            // Paddle collision
            if (ball.y + ball.dy > paddle.y - ball.r && ball.y < paddle.y + paddle.h) {
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                    ball.dy = -Math.abs(ball.dy); // Force up
                    // Add some english (spin)
                    let hitPoint = ball.x - (paddle.x + paddle.w/2);
                    ball.dx = hitPoint * 0.15;
                }
            }
        }

        function collisionDetection() {
            for (let c = 0; c < blockColumnCount; c++) {
                for (let r = 0; r < blockRowCount; r++) {
                    let b = blocks[c][r];
                    if (b.status === 1) {
                        if (ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;

                            if(score === blockRowCount * blockColumnCount * 10) {
                                gameState = 'clear';
                            }
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBlocks();
            drawPaddle();
            drawBall();
            drawScore();
        }

        function showMessage(text) {
            messageText.innerHTML = text;
            messageBox.style.display = 'block';
        }

        function gameLoop() {
            if (gameState === 'playing') {
                movePaddle();
                moveBall();
                collisionDetection();
                draw();
                requestAnimationFrame(gameLoop);
            } else if (gameState === 'gameover') {
                showMessage(`ゲームオーバー<br>Score: ${score}<br><span style="font-size:16px;">タップしてリトライ</span>`);
            } else if (gameState === 'clear') {
                showMessage(`クリア！<br>Score: ${score}<br><span style="font-size:16px;">タップしてもう一度</span>`);
            }
        }

        // Setup
        resizeCanvas();
        showMessage("タップしてスタート");

    </script>
</body>
</html>
