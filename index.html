<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Block Breaker</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #111;
    color: #fff;
    font-family: sans-serif;
    touch-action: none; /* Prevent scrolling on mobile */
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #ui {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.7);
    padding: 20px;
    border-radius: 10px;
  }
  h1 { margin: 0 0 10px 0; font-size: 2rem; color: #00E5FF; }
  p { margin: 0; font-size: 1.2rem; color: #ddd; }
</style>
</head>
<body>
<div id="ui">
  <h1 id="title">ブロック崩し</h1>
  <p id="subtitle">画面をタップしてスタート</p>
</div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');

let width, height;
let gameState = 'START'; // START, PLAYING, GAMEOVER, CLEAR
let animationId;

// Game objects
const ball = { x: 0, y: 0, dx: 0, dy: 0, radius: 8, baseSpeed: 6 };
const paddle = { x: 0, y: 0, width: 90, height: 14 };
const brickInfo = {
  rowCount: 6,
  columnCount: 5,
  width: 0,
  height: 25,
  padding: 10,
  offsetTop: 80,
  offsetLeft: 15
};
let bricks = [];
let score = 0;
let lives = 3;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  
  // Adjust paddle
  paddle.y = height - 80;
  if (gameState === 'START') {
    paddle.x = (width - paddle.width) / 2;
    ball.x = width / 2;
    ball.y = paddle.y - ball.radius - 1;
  }

  // Adjust bricks
  brickInfo.width = (width - brickInfo.offsetLeft * 2 - brickInfo.padding * (brickInfo.columnCount - 1)) / brickInfo.columnCount;
}

window.addEventListener('resize', () => {
  if (gameState !== 'PLAYING') resize();
});

function initBricks() {
  bricks = [];
  for (let c = 0; c < brickInfo.columnCount; c++) {
    bricks[c] = [];
    for (let r = 0; r < brickInfo.rowCount; r++) {
      bricks[c][r] = { x: 0, y: 0, status: 1 };
    }
  }
}

function initGame() {
  resize();
  initBricks();
  score = 0;
  lives = 3;
  resetBall();
  gameState = 'START';
  ui.style.display = 'block';
  titleEl.innerText = 'ブロック崩し';
  subtitleEl.innerText = 'タップしてスタート';
  draw();
}

function resetBall() {
  paddle.x = (width - paddle.width) / 2;
  ball.x = width / 2;
  ball.y = paddle.y - ball.radius - 1;

  ball.dx = Math.random() > 0.5 ? 4 : -4;
  ball.dy = -5;

  // Normalize speed
  const speed = Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy);
  ball.dx = (ball.dx / speed) * ball.baseSpeed;
  ball.dy = (ball.dy / speed) * ball.baseSpeed;
}

// Input handling
let isDragging = false;
function handlePointerDown(e) {
  if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'CLEAR') {
    if (gameState === 'GAMEOVER' || gameState === 'CLEAR') {
      initGame();
    } else {
      gameState = 'PLAYING';
      ui.style.display = 'none';
      update();
    }
    return;
  }
  isDragging = true;
  movePaddle(e);
}

function handlePointerMove(e) {
  if (isDragging && gameState === 'PLAYING') {
    movePaddle(e);
  }
}

function handlePointerUp() {
  isDragging = false;
}

function movePaddle(e) {
  let clientX;
  if (e.touches && e.touches.length > 0) {
    clientX = e.touches[0].clientX;
  } else {
    clientX = e.clientX;
  }
  paddle.x = clientX - paddle.width / 2;

  // Boundary check
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.width > width) paddle.x = width - paddle.width;
}

canvas.addEventListener('mousedown', handlePointerDown);
canvas.addEventListener('mousemove', handlePointerMove);
window.addEventListener('mouseup', handlePointerUp);

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e); }, { passive: false });
window.addEventListener('touchend', handlePointerUp);


function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.closePath();
}

function drawPaddle() {
  ctx.beginPath();
  // rounded paddle
  ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 5);
  ctx.fillStyle = '#00E5FF';
  ctx.fill();
  ctx.closePath();
}

function drawBricks() {
  for (let c = 0; c < brickInfo.columnCount; c++) {
    for (let r = 0; r < brickInfo.rowCount; r++) {
      if (bricks[c][r].status === 1) {
        const brickX = (c * (brickInfo.width + brickInfo.padding)) + brickInfo.offsetLeft;
        const brickY = (r * (brickInfo.height + brickInfo.padding)) + brickInfo.offsetTop;
        bricks[c][r].x = brickX;
        bricks[c][r].y = brickY;

        ctx.beginPath();
        ctx.roundRect(brickX, brickY, brickInfo.width, brickInfo.height, 4);

        // Colors based on row
        const colors = ['#FF3B30', '#FF9F0A', '#FFD60A', '#32D74B', '#00E5FF', '#BF5AF2'];
        ctx.fillStyle = colors[r % colors.length];
        ctx.fill();
        ctx.closePath();
      }
    }
  }
}

function drawScore() {
  ctx.font = '18px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('Score: ' + score, 15, 40);
}

function drawLives() {
  ctx.font = '18px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('Lives: ' + lives, width - 85, 40);
}

function collisionDetection() {
  let activeBricks = 0;
  for (let c = 0; c < brickInfo.columnCount; c++) {
    for (let r = 0; r < brickInfo.rowCount; r++) {
      const b = bricks[c][r];
      if (b.status === 1) {
        activeBricks++;
        // simple AABB collision with ball radius padding
        if (ball.x + ball.radius > b.x && ball.x - ball.radius < b.x + brickInfo.width &&
            ball.y + ball.radius > b.y && ball.y - ball.radius < b.y + brickInfo.height) {

          // determine bounce direction
          // checking previous position to see if it was a horizontal or vertical hit
          const prevX = ball.x - ball.dx;
          const prevY = ball.y - ball.dy;

          if (prevX + ball.radius <= b.x || prevX - ball.radius >= b.x + brickInfo.width) {
            ball.dx = -ball.dx;
          } else {
            ball.dy = -ball.dy;
          }

          b.status = 0;
          score += 10;
        }
      }
    }
  }

  if (activeBricks === 0 && gameState === 'PLAYING') {
    gameState = 'CLEAR';
    ui.style.display = 'block';
    titleEl.innerText = 'GAME CLEAR!';
    subtitleEl.innerText = 'タップしてもう一度';
  }
}

function draw() {
  ctx.clearRect(0, 0, width, height);
  drawBricks();
  drawBall();
  drawPaddle();
  drawScore();
  drawLives();
}

function update() {
  if (gameState !== 'PLAYING') return;

  collisionDetection();

  // Wall collision (left/right)
  if (ball.x + ball.dx > width - ball.radius || ball.x + ball.dx < ball.radius) {
    ball.dx = -ball.dx;
  }
  // Ceiling collision
  if (ball.y + ball.dy < ball.radius) {
    ball.dy = -ball.dy;
  } else if (ball.y + ball.dy > height + ball.radius * 2) {
    // Bottom out
    lives--;
    if (!lives) {
      gameState = 'GAMEOVER';
      ui.style.display = 'block';
      titleEl.innerText = 'GAME OVER';
      subtitleEl.innerText = 'タップしてリトライ';
      draw();
      return;
    } else {
      resetBall();
      gameState = 'START';
      ui.style.display = 'block';
      titleEl.innerText = 'Ready?';
      subtitleEl.innerText = 'タップして再開';
      draw();
      return;
    }
  }

  // Paddle collision
  if (ball.dy > 0 &&
      ball.y + ball.radius >= paddle.y &&
      ball.y - ball.radius <= paddle.y + paddle.height &&
      ball.x + ball.radius >= paddle.x &&
      ball.x - ball.radius <= paddle.x + paddle.width) {

    // Bounce
    ball.dy = -Math.abs(ball.dy); // Ensure it goes up

    // Add english based on where it hit the paddle
    let hitPoint = ball.x - (paddle.x + paddle.width / 2);
    ball.dx += hitPoint * 0.05;

    // Normalize speed (keep it constant)
    const speed = Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy);
    ball.dx = (ball.dx / speed) * ball.baseSpeed;
    ball.dy = (ball.dy / speed) * ball.baseSpeed;

    // Prevent ball from getting stuck in paddle
    ball.y = paddle.y - ball.radius - 1;
  }

  ball.x += ball.dx;
  ball.y += ball.dy;

  draw();

  if (gameState === 'PLAYING') {
    animationId = requestAnimationFrame(update);
  }
}

// polyfill for roundRect if not available
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  }
}

// Initial setup
initGame();

</script>
</body>
</html>
